# =============================================================================
# Easy Pass — Dashboard Examples
#
# Entity IDs are built from the CARD DEVICE name (license plate), e.g.
#   sensor.easy_pass_<PLATE_SLUG>_easy_pass_balance
#   select.easy_pass_<PLATE_SLUG>_history_range
#
# The example slug below is:  6khkh_5101_krungethphmhaankhr
# Replace it everywhere with YOUR slug. Find it in:
#   Developer Tools → States → filter "easy_pass"
#
# Requires Mushroom Cards (https://github.com/piitaya/lovelace-mushroom)
# for the custom:mushroom-* cards. The gauge and markdown cards are stock HA.
#
# The FULL DASHBOARD VIEW auto-discovers all cards and also needs auto-entities
# (https://github.com/thomasloven/lovelace-auto-entities, HACS).
# The remaining snippets (CARD DETAILS GRID, CHIPS BAR, HISTORY RANGE SELECTOR,
# automation) are single-card examples; replace the slug per card.
# =============================================================================


# =============================================================================
# FULL DASHBOARD VIEW — ALL CARDS (requires Mushroom + auto-entities from HACS)
# =============================================================================
type: sections
title: Easy Pass
max_columns: 2
sections:
  # ---- Account summary + the single history selector ----
  - type: grid
    title: Easy Pass
    column_span: 2
    cards:
      - type: custom:mushroom-template-card
        primary: >
          {% set ns = namespace(t=0) %}
          {% for e in integration_entities('easypass_th') | select('search', '_easy_pass_balance$') %}
          {% set ns.t = ns.t + states(e) | float(0) %}
          {% endfor %}
          {{ ns.t | round(2) }} ฿
        secondary: >
          ยอดรวม {{ integration_entities('easypass_th') | select('search', '_easy_pass_balance$') | list | count }} บัตร
        icon: mdi:wallet
        icon_color: green
      - type: custom:mushroom-template-card
        primary: >
          {% set ns = namespace(t=0) %}
          {% for e in integration_entities('easypass_th') | select('search', '_easy_pass_monthly_spend$') %}
          {% set ns.t = ns.t + states(e) | float(0) %}
          {% endfor %}
          {{ ns.t | round(2) }} ฿
        secondary: ค่าทางด่วนเดือนนี้ (ทุกบัตร)
        icon: mdi:cash-multiple
        icon_color: blue
      # History range is per account: show exactly one selector.
      - type: custom:auto-entities
        card:
          type: vertical-stack
        card_param: cards
        show_empty: false
        filter:
          include:
            - domain: select
              integration: easypass_th
              options:
                type: custom:mushroom-select-card
                entity: this.entity_id
                name: ช่วงเวลาประวัติ
                icon: mdi:history
                icon_color: blue
                fill_container: true
        sort:
          method: entity_id
          count: 1

  # ---- One block per card (auto-discovered) ----
  - type: grid
    column_span: 2
    cards:
      - type: custom:auto-entities
        card:
          type: grid
          columns: 1
          square: false
        card_param: cards
        show_empty: false
        sort:
          method: entity_id
        filter:
          include:
            - integration: easypass_th
              domain: sensor
              entity_id: "*_easy_pass_balance"
              options:
                type: vertical-stack
                cards:
                  # mushroom-title-card renders templates; the stock heading card does not.
                  - type: custom:mushroom-title-card
                    title: "🚗 {{ state_attr('this.entity_id', 'license_plate') }}"
                    subtitle: >-
                      {{ state_attr('this.entity_id' | replace('_easy_pass_balance', '_easy_pass_monthly_spend'), 'transaction_count') | int(0) }} ครั้งเดือนนี้
                  - type: grid
                    columns: 2
                    square: false
                    cards:
                      - type: custom:mushroom-template-card
                        entity: this.entity_id
                        primary: "{{ states(entity) | float(0) | round(2) }} ฿"
                        secondary: "อัปเดต {{ relative_time(states[entity].last_updated) }} ที่แล้ว"
                        icon: mdi:cash
                        icon_color: >
                          {% set bal = states(entity) | float(0) %}
                          {% if bal < 100 %}red{% elif bal < 300 %}orange{% else %}green{% endif %}
                        tap_action:
                          action: more-info
                      - type: custom:mushroom-template-card
                        entity: this.entity_id
                        primary: >
                          {{ states(entity | replace('_easy_pass_balance', '_easy_pass_monthly_spend')) }} ฿
                        secondary: ค่าทางด่วนเดือนนี้
                        icon: mdi:cash-multiple
                        icon_color: blue
                      - type: custom:mushroom-template-card
                        entity: this.entity_id
                        primary: >
                          {{ states(entity | replace('_easy_pass_balance', '_easy_pass_reward_points')) }} คะแนน
                        secondary: คะแนนสะสม
                        icon: mdi:star-circle
                        icon_color: amber
                      - type: custom:mushroom-template-card
                        entity: this.entity_id
                        primary: >
                          {{ states(entity | replace('_easy_pass_balance', '_easy_pass_last_toll_location')) }}
                        secondary: >
                          {% set lt = entity | replace('_easy_pass_balance', '_easy_pass_last_toll_location') %}
                          {{ state_attr(lt, 'txn_date') }} — {{ state_attr(lt, 'amount') }} ฿
                        icon: mdi:map-marker
                  - type: gauge
                    entity: this.entity_id
                    name: ยอดเงินคงเหลือ
                    unit: ฿
                    min: 0
                    max: 1000
                    needle: true
                    severity:
                      green: 300
                      yellow: 100
                      red: 0
                  - type: markdown
                    title: ประวัติการใช้งาน
                    content: >
                      | # | วันที่ | ประเภท | จำนวน | คงเหลือ | ด่าน |

                      |---|--------|--------|------:|--------:|------|

                      {% for t in state_attr('this.entity_id', 'transactions') | default([], true) -%}
                      | {{ loop.index }} | {{ t.date }} | {{ t.type }} | {{ t.amount }} | {{ t.balance_after }} | {{ t.location }} |

                      {% endfor -%}


# =============================================================================
# CARD DETAILS GRID  (license plate, serial, owner, M-Flow)
# =============================================================================
type: grid
cards:
  - type: heading
    heading: ข้อมูลบัตร
    heading_style: title
  - type: custom:mushroom-entity-card
    entity: sensor.easy_pass_6khkh_5101_krungethphmhaankhr_easy_pass_license_plate
    name: ทะเบียนรถ
    icon: mdi:car
    icon_color: blue
    fill_container: true
  - type: custom:mushroom-entity-card
    entity: sensor.easy_pass_6khkh_5101_krungethphmhaankhr_easy_pass_card_serial
    name: หมายเลขการ์ด (S/N)
    icon: mdi:card-account-details
    icon_color: purple
    fill_container: true
  - type: custom:mushroom-entity-card
    entity: sensor.easy_pass_6khkh_5101_krungethphmhaankhr_easy_pass_account_owner
    name: เจ้าของบัตร
    icon: mdi:account
    icon_color: indigo
    fill_container: true
  - type: custom:mushroom-entity-card
    entity: sensor.easy_pass_6khkh_5101_krungethphmhaankhr_easy_pass_m_flow_status
    name: สถานะ M-Flow
    icon: mdi:highway
    icon_color: teal
    fill_container: true


# =============================================================================
# CHIPS BAR  (compact — put at top of any view)
# =============================================================================
type: custom:mushroom-chips-card
chips:
  - type: entity
    entity: sensor.easy_pass_6khkh_5101_krungethphmhaankhr_easy_pass_balance
    icon: mdi:cash
    content_info: state
  - type: entity
    entity: sensor.easy_pass_6khkh_5101_krungethphmhaankhr_easy_pass_license_plate
    icon: mdi:car
    content_info: state


# =============================================================================
# HISTORY RANGE SELECTOR  (standalone — switch 7 / 30 / 90-day window)
# Changing the value triggers a coordinator reload and re-fetches data.
# Entity name is "<plate>_history_range" (NOT "..._easy_pass_history_range").
# =============================================================================
type: custom:mushroom-select-card
entity: select.easy_pass_6khkh_5101_krungethphmhaankhr_history_range
name: ช่วงเวลาประวัติ
icon: mdi:history
icon_color: blue
fill_container: true


